{% extends "base.html" %}
{% block title %}Anmelden – zoomrec{% endblock %}
{% block content %}
<section class="login">
  <div class="login-card">
    <div class="login-logo"><span class="brand-dot big"></span></div>
    <h1>zoomrec</h1>
    <p class="muted">Deine Vorlesungsaufnahmen</p>
    <form method="post">
      <label for="password" class="sr-only">Passwort</label>
      <input type="password" id="password" name="password" placeholder="Passwort" autofocus required autocomplete="current-password">
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <button class="btn primary block">Anmelden</button>
    </form>
  </div>
</section>
{% endblock %}
