services:
  zoomrec:
    build:
      context: .
      args:
        # "latest" or a specific Zoom version, e.g. 6.4.6.1370
        ZOOM_VERSION: ${ZOOM_VERSION:-latest}
    image: zoomrec:local
    container_name: zoomrec
    restart: unless-stopped
    # Zoom (Qt WebEngine/Chromium) needs more than the default 64 MB /dev/shm
    shm_size: 1gb
    environment:
      TZ: ${TZ:-Europe/Vienna}
      VNC_PW: ${VNC_PW:-zoomrec}
      # Screen size of the virtual desktop, this is also the recording resolution
      VNC_RESOLUTION: ${VNC_RESOLUTION:-1920x1080}
      DEBUG: ${DEBUG:-False}
      DISPLAY_NAME: ${DISPLAY_NAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Changes to config/meetings.csv are picked up without a restart
      MEETINGS_CSV: /home/zoomrec/config/meetings.csv
      PLAY_AUDIO: ${PLAY_AUDIO:-false}
      # Recording quality: lower CRF = better quality and bigger files
      RECORD_FPS: ${RECORD_FPS:-15}
      RECORD_CRF: ${RECORD_CRF:-28}
      RECORD_THREADS: ${RECORD_THREADS:-2}
    ports:
      # Only reachable from the VM itself, use an SSH tunnel for remote access
      - "127.0.0.1:5901:5901"
    volumes:
      - ./recordings:/home/zoomrec/recordings
      - ./config:/home/zoomrec/config:ro
      - ./audio:/home/zoomrec/audio:ro
