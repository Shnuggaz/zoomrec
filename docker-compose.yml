services:
  zoomrec:
    build:
      context: .
      args:
        # "latest" or a specific Zoom version, e.g. 6.4.6.1370
        ZOOM_VERSION: ${ZOOM_VERSION:-latest}
    image: zoomrec:local
    container_name: zoomrec
    # Files are created with this group (e.g. a shared media group), see PGID in .env
    user: "1000:${PGID:-1000}"
    # Stable host name, Zoom stores it with its profile
    hostname: zoomrec
    restart: unless-stopped
    # Zoom (Qt WebEngine/Chromium) needs more than the default 64 MB /dev/shm
    shm_size: 1gb
    environment:
      TZ: ${TZ:-Europe/Vienna}
      UMASK: ${UMASK:-0002}
      VNC_PW: ${VNC_PW:-zoomrec}
      # Screen size of the virtual desktop, this is also the recording resolution
      VNC_RESOLUTION: ${VNC_RESOLUTION:-1920x1080}
      DEBUG: ${DEBUG:-False}
      # Name shown to the other participants
      DISPLAY_NAME: ${DISPLAY_NAME:-zoomrec}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Changes to config/meetings.csv are picked up without a restart
      MEETINGS_CSV: /home/zoomrec/config/meetings.csv
      PLAY_AUDIO: ${PLAY_AUDIO:-false}
      # Recording quality: lower CRF = better quality and bigger files
      RECORD_FPS: ${RECORD_FPS:-15}
      RECORD_CRF: ${RECORD_CRF:-24}
      RECORD_THREADS: ${RECORD_THREADS:-2}
      # Optional: automatic transcription with a self-hosted Scriberr (https://github.com/rishikanthc/Scriberr)
      SCRIBERR_URL: ${SCRIBERR_URL:-}
      SCRIBERR_API_KEY: ${SCRIBERR_API_KEY:-}
      SCRIBERR_MODEL: ${SCRIBERR_MODEL:-small}
      SCRIBERR_LANGUAGE: ${SCRIBERR_LANGUAGE:-de}
      SCRIBERR_DEVICE: ${SCRIBERR_DEVICE:-cpu}
    ports:
      # Only reachable from the VM itself, use an SSH tunnel for remote access
      - "127.0.0.1:5901:5901"
    volumes:
      # RECORDINGS_PATH can point to a network share mounted on the host
      - ${RECORDINGS_PATH:-./recordings}:/home/zoomrec/recordings
      # Local directory for the running recording, finished files are moved to RECORDINGS_PATH
      - ${WORK_PATH:-./work}:/home/zoomrec/work
      - ./config:/home/zoomrec/config:ro
      - ./audio:/home/zoomrec/audio:ro
      # Zoom settings (e.g. skip join preview, remembered name), survive image updates
      - ./zoom-profile:/home/zoomrec/.zoom

  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    image: zoomrec-webui:local
    container_name: zoomrec-webui
    user: "1000:${PGID:-1000}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Vienna}
      UMASK: ${UMASK:-0002}
      # Required, the web interface does not start without a password
      WEB_PASSWORD: ${WEB_PASSWORD:?Set WEB_PASSWORD in .env}
      # true when a HTTPS reverse proxy forwards to the web interface
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RECORDINGS_DIR: /data/recordings
      MEETINGS_CSV: /data/config/meetings.csv
    ports:
      # Default: only reachable on the VM itself. WEB_BIND=0.0.0.0 makes it reachable in the LAN.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - ${RECORDINGS_PATH:-./recordings}:/data/recordings
      - ./config:/data/config
    mem_limit: 256m
